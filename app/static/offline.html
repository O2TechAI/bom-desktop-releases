<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O2 BOM</title>
    <link rel="stylesheet" href="local.css" />
    <script type="module" src="local.js"></script>
  </head>
  <body data-page="offline">
    <main class="card" aria-labelledby="title">
      <div class="brand" aria-hidden="true"><img src="vendor/o2-mark.png" alt="" /></div>
      <h1 id="title" data-copy="offline_title"></h1>
      <p role="alert" data-copy="offline_body"></p>
      <div class="actions">
        <button class="button button-primary" type="button" data-action="retry" data-copy="try_again"></button>
      </div>
    </main>
  </body>
</html>
