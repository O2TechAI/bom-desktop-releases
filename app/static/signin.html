<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O2 BOM</title>
    <link rel="stylesheet" href="local.css" />
    <script type="module" src="local.js"></script>
  </head>
  <body data-page="signin">
    <main class="card" aria-labelledby="title">
      <div class="brand" aria-hidden="true"><img src="vendor/o2-mark.png" alt="" /></div>
      <h1 id="title" data-copy="signin_title"></h1>
      <p data-copy="signin_body"></p>
      <div class="actions">
        <a class="button button-secondary" data-action="again" data-copy="open_again" href="#"></a>
        <a class="button button-quiet" data-action="back" data-copy="back_to_sign_in" href="#"></a>
      </div>
    </main>
  </body>
</html>
