<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buy lab</title>
    <link rel="stylesheet" href="buy-lab.css" />
    <script type="module" src="buy-lab.js"></script>
    <script type="module" src="live.js"></script>
  </head>
  <body>
    <header class="bar">
      <button class="quiet back-to-site" type="button" data-back-site hidden></button>
      <label class="supplier">
        <span class="supplier-label" data-address-label>Ship to</span>
        <select data-address></select>
      </label>
      <button class="quiet" type="button" data-address-manage>Addresses</button>

      <label class="rehearsal" data-rehearsal-label>
        <input type="checkbox" data-rehearsal>
        <span data-rehearsal-text>Rehearsal (no order)</span>
      </label>

      <div class="actions">
        <button class="primary" type="button" data-demo>Demo</button>
        <button class="quiet" type="button" data-stop-all>Stop all</button>
        <button class="quiet" type="button" data-external>Open in browser</button>
      </div>
    </header>

    <main class="page">
      <p class="service-note" role="status" data-service hidden></p>
      <section class="card address-form" data-address-form hidden>
        <div class="address-fields" data-address-fields></div>
        <div class="row">
          <button class="primary" type="button" data-address-save>Save</button>
          <button class="quiet" type="button" data-address-new>New address</button>
          <button class="quiet" type="button" data-address-delete>Delete</button>
          <button class="quiet" type="button" data-address-close>Close</button>
          <span class="hint" data-address-message role="status"></span>
        </div>
        <p class="hint" data-address-note></p>
      </section>

      <p class="hint page-hint" data-hint></p>

      <!-- One panel per supplier (buy-lab.js): its list, its run, its cart. -->
      <section class="suppliers" data-suppliers></section>
    </main>

    <div class="live" data-live hidden>
      <div class="stage" data-stage>
        <canvas class="screen" data-screen tabindex="0" aria-label="Supplier page"></canvas>
        <p class="status" data-status role="status">Connecting to Chrome…</p>
        <button class="back" type="button" data-back>← Back to the list</button>
        <!-- The supplier Chrome's tabs (live.js): the main one, and a sign-in elsewhere. -->
        <nav class="tabs" data-tabs aria-label="Tabs"></nav>
      </div>
    </div>
  </body>
</html>
